<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="assets/fonts.css">
    <style>
      *{ margin:0; padding:0; box-sizing:border-box; }
      html,body{ width:1200px; height:630px; overflow:hidden; }
      body{
        background:#05070a; color:#f4f1ea; position:relative;
        font-family:"Hanken Grotesk",system-ui,sans-serif;
        display:grid; grid-template-rows:1fr auto; padding:68px 76px 60px;
      }
      .glow{
        position:absolute; inset:-30% -10% auto -20%; height:150%;
        background:radial-gradient(60% 55% at 22% 38%, rgba(96,165,250,.20), transparent 68%),
                   radial-gradient(45% 45% at 88% 8%, rgba(244,114,182,.13), transparent 70%);
      }
      .grid{
        position:absolute; inset:0; opacity:.16;
        background-image:linear-gradient(rgba(244,241,234,.10) 1px, transparent 1px),
                         linear-gradient(90deg, rgba(244,241,234,.10) 1px, transparent 1px);
        background-size:60px 60px;
        mask-image:radial-gradient(70% 70% at 30% 40%, #000 20%, transparent 78%);
      }
      .star{ position:absolute; right:-70px; top:-90px; width:620px; height:620px; opacity:.30; }
      .body{ position:relative; display:flex; flex-direction:column; justify-content:center; gap:22px; max-width:880px; }
      .kicker{
        font-family:"JetBrains Mono",ui-monospace,monospace; font-size:21px; letter-spacing:.22em;
        text-transform:uppercase; color:#8ea3c0;
      }
      h1{
        font-family:"Big Shoulders Display","Hanken Grotesk",sans-serif; font-weight:800;
        font-size:var(--size,138px); line-height:.86; letter-spacing:-.015em; text-transform:uppercase;
      }
      h1 .thin{ font-weight:300; color:#b9c6d8; }
      .ar{
        font-family:"IBM Plex Sans Arabic",serif; font-weight:700; font-size:50px;
        color:#cbb68a; direction:rtl; unicode-bidi:isolate; line-height:1.3;
        width:max-content; margin-top:-6px;
      }
      .line{ font-size:29px; line-height:1.4; color:#d6dce6; max-width:780px; }
      .foot{
        position:relative; display:flex; align-items:center; justify-content:space-between;
        border-top:1px solid rgba(244,241,234,.18); padding-top:26px;
        font-family:"JetBrains Mono",ui-monospace,monospace; font-size:23px; color:#9fb0c6;
      }
      .foot b{ color:#f4f1ea; font-weight:500; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <svg class="star" viewBox="0 0 200 200" fill="none" stroke="rgba(203,182,138,.55)" stroke-width="0.7">
      <g transform="translate(100 100)">
        <!-- a ten point girih rosette, the motif the site has carried since v1 -->
        <circle r="92"/><circle r="66"/><circle r="40"/>
        <g id="s">
          <path d="M0 -92 L28 -28 L92 0 L28 28 L0 92 L-28 28 L-92 0 L-28 -28 Z"/>
        </g>
        <use href="#s" transform="rotate(18)"/>
        <use href="#s" transform="rotate(36)"/>
        <use href="#s" transform="rotate(54)"/>
        <use href="#s" transform="rotate(72)"/>
      </g>
    </svg>
    <div class="body">
      <p class="kicker">__KICKER__</p>
      <h1 style="--size:__SIZE__px">__TITLE__</h1>
      <p class="ar" lang="ar">__ARABIC__</p>
      <p class="line">__LINE__</p>
    </div>
    <div class="foot"><span><b>aminehamlouchi.com</b></span><span>__FOOT__</span></div>
  </body>
</html>
