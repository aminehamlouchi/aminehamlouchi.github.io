<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Amine Hamlouchi">
  <rect width="64" height="64" rx="10" fill="#0b0a08"/>
  <!-- eight-point star (two rotated squares) -->
  <g transform="translate(32 32)">
    <rect x="-13" y="-13" width="26" height="26" fill="none" stroke="#ffb000" stroke-width="3"/>
    <rect x="-13" y="-13" width="26" height="26" fill="none" stroke="#ffb000" stroke-width="3" transform="rotate(45)"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffb000"/>
  </g>
</svg>
